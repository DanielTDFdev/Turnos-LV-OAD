  v1.24 · FIX de fondo del "todo al revés" que reportó Daniel (traza gira al

  real: no era un error de una fórmula puntual — repasé rumbo, rotación del
  avión y posición del compás, y las tres son matemáticamente consistentes
  entre sí (esto ya se había verificado). La causa real es más de fondo:
  three.js arma la cámara con Y como "arriba" (convención right-handed
  estándar), y con ese sistema, mirando derecho para abajo con "arriba de
  pantalla"=Norte, el Este proyecta invertido — es una propiedad matemática
  de cómo se arma la cámara para ESTE tipo de mundo (Norte=+Z), no un typo en
  ningún lado. Confirmado con un test aislado: un punto en Este real (mundo
  +X) proyecta a pantalla NEGATIVA (izquierda) con cámara ortográfica derecho
  para abajo y arriba=Norte. Esto afecta a TODO lo que se ve en el canvas por
  igual (compás Y forma de la traza), lo cual explica que ambos reportes de
  Daniel fueran síntomas del mismo problema.

  píxeles finales (transform:scaleX(-1) en CSS) — ningún vértice/normal de
  malla se toca, cero riesgo de romper el modelo GLB o el tubo por una

  v1.14 · Segundo fix reportado por Daniel sobre el humo (el de v1.13 no
  alcanzaba: seguía viéndose nube a 1x, recién a 5x se notaba trail). La causa
  real no era el espaciado entre puffs (eso ya quedó bien en v1.13) sino el
  CRECIMIENTO y la DERIVA hacia arriba de cada puff, que usaban dt REAL
  (`scale.multiplyScalar(1+dt*0.4)` y `position.y += dt*2`, cada frame). Un
  puff tarda más tiempo REAL en apagarse cuanto más lento se reproduce (a 1x,
  más segundos reales por cada largo de avión recorrido que a 5x) — y con
  crecimiento compuesto por segundo real, esos puffs más longevos en tiempo
  real terminaban mucho más grandes: a 1x se inflaban hasta juntarse en una
  sola nube, a 5x apenas si les daba tiempo a crecer y por eso ahí sí se veía
  fino y separado. Ahora tamaño y altura de cada puff se calculan directo en
  función de "t" (0→1, el mismo avance por DISTANCIA que ya se usa para
  decidir cuándo apagarlo — ver v1.12/v1.13), nunca de cuántos segundos reales
  pasaron: mismo resultado visual sin importar a qué velocidad "x" se
  reproduzca. De paso, el tamaño base de cada puff se desató de MODELO_ESCALA
  (quedaba grande contra el objetivo de estela, que está en "largos de
  avión") y pasa a ser una fracción de AVION_LARGO_MUNDO (14-20% de un largo
  de avión), para que se vea fino: varios puffs distinguibles a lo largo de
  la estela en vez de una bocha.

  v1.13 · Fix reportado por Daniel: a velocidad 1x el humo se veía como una
  nube pegada al avión en vez de una estela. Causa real: el DISPARADOR de
  emisión (v1.12 y anteriores) generaba un puff cada HUMO_INTERVALO segundos
  de tiempo real, sin relación con la distancia que el avión recorría en ese
  momento — mientras que el APAGADO de cada puff (desde v1.12) sí es por
  distancia recorrida (3 largos de avión). Con un objetivo tan corto, a 1x los
  puffs se emitían casi en el mismo punto antes de que el anterior terminara
  de apagarse: quedaban amontonados en vez de espaciados a lo largo del
  camino. Ahora el disparador también es por distancia real recorrida por el
  avión (que ya refleja tanto la velocidad real del vuelo como el selector de
  velocidad "x" del reproductor, porque currentT avanza con dt*speed), con un
  espaciado de HUMO_LARGO_OBJETIVO/12 entre puffs — así la estela mantiene
  ~12 puffs a lo largo de sus 3 largos de avión sin importar a qué velocidad
  se reproduzca. De paso, se le puso un tope al tamaño de cada puff
  (HUMO_LARGO_OBJETIVO*0.35) para que ninguno solo pueda tapar más de un
  tercio de la estela — si no, con un objetivo tan corto, 1-2 puffs grandes ya
  alcanzaban a cubrirla entera y se veía como una sola bocha en vez de un
  rastro con varios puffs distinguibles.

  v1.12 · Pedido de Daniel: (1) FIX zoom/rotar no funcionaban en celular — el
  rotar usaba pointerdown/move/up (que sí incluye touch), pero el canvas no
  tenía touch-action:none, así que el navegador competía por el gesto (scroll
  de la página) y a veces se lo quedaba él. El zoom SÍ estaba realmente roto:
  dependía 100% del evento "wheel", que no existe en touch — un pinch de dos
  dedos nunca lo disparaba. Se agregó manejo de pinch-to-zoom con Pointer
  Events (Map de punteros activos, distancia entre los dos primeros, delta de
  distancia entre frames alimenta la misma lógica de zoom que ya usaba la
  rueda). (2) Unidad de medida para el humo: la estela ahora dura, en
  distancia real recorrida por el avión, HUMO_LARGO_OBJETIVO_MULT (3) largos
  de avión — antes era un tiempo fijo (HUMO_VIDA, 7s) sin relación con el
  tamaño del avión ni con su velocidad real. AVION_LARGO_MUNDO se mide del
  bounding box del GLB (eje Z, que es el eje nariz-cola del modelo) ya
  multiplicado por MODELO_ESCALA. Se mantiene un tope de tiempo de seguridad
  (HUMO_VIDA_MAX, 20s) por si el track tuviera velocidad ~0 sostenida, para
  que el humo no se acumule sin límite.

  avión embebido en base64 para poder compartirlo en el chat), acá el GLB va
  como archivo aparte (aeroplane.glb, subido junto a este HTML) — cacheable
  por Cloudflare, no infla este archivo con 60KB de texto.

  Los puntos GPS crudos (lat/lng/alt/ts) no traen heading, groundspeed ni
  vertical speed — se derivan entre puntos consecutivos y se SUAVIZAN (ventana
  ±2 muestras, heading por promedio circular) antes de estimar bank/pitch; sin
  ese suavizado, el ruido normal del GPS hace temblar la animación. Ver
  procesarPuntos() más abajo.

  Pendiente para una v1.1: botón "Ver en 3D" desde el modal de análisis GPS de
  turnos.html/vuelo-piloto.html que abra esta página con el ?key= correcto.
==================================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis 3D — Aeroclub Río Grande</title>
<style>
  :root{
    --bg3:#141b2b; --border:#232d42;
    --text:#e8edf5; --text2:#9aa8c2; --text3:#5c6a86; --cyan:#38d6e0; --amber:#ffb454;
    --font-mono:'SF Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e16;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;flex-shrink:0}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em}
  .badge{font-family:var(--font-mono);font-size:10px;color:var(--amber);border:1px solid var(--amber);
    border-radius:4px;padding:2px 7px;letter-spacing:.08em}
  header .nota{font-family:var(--font-mono);font-size:11px;color:var(--text3);margin-left:auto}
  /* v2: cielo = degradado blanco->celeste en el propio contenedor; el canvas es
     transparente (alpha:true) así que este fondo se ve DETRÁS de la escena 3D en
     vez del negro sólido de antes. */
  #stage{position:relative;flex:1;min-height:0;
    background:linear-gradient(to bottom, #dff3fa 0%, #86cbe8 40%, #3f9dc7 100%)}
  #stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;
    /* v1.24 FIX: three.js, con un mundo Y-arriba (est.=+X, norte=+Z) visto
    desde arriba, dibuja el Este espejado — es una propiedad matemática de
    cómo arma la cámara (confirmado con el motor real: un punto en mundo +X,
    con cámara mirando derecho para abajo y "arriba"=Norte, proyecta a
    pantalla NEGATIVO). No es un bug de una fórmula puntual (rumbo, rotación
    del avión, y posición del compás dan TODOS consistentes entre sí — el
    problema es la relación entre esa convención y cómo three.js arma la
    cámara). Se corrige con un espejo horizontal a nivel de PIXELES finales
    (transform en el canvas, no en la geometría 3D) — así no se tocan
    vértices/normales de mallas complejas (el modelo GLB, el tubo), que se
    romperían con una escala negativa aplicada a la escena.*/
    transform:scaleX(-1)}
  #stage canvas:active{cursor:grabbing}
  .panel{position:absolute;background:rgba(15,20,32,.88);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text2);
    backdrop-filter:blur(4px)}
  #info{top:12px;left:12px;min-width:190px;line-height:1.75}
  #info b{color:var(--text);font-size:15px}
  #info .row{display:flex;justify-content:space-between;gap:14px}
  #info .lbl{color:var(--text3)}
  #legend{top:12px;right:12px;width:170px}
  #legend .bar{height:10px;border-radius:3px;margin:6px 0;
    background:linear-gradient(90deg,hsl(240,90%,55%),hsl(120,90%,45%),hsl(0,90%,55%))}
  #legend .scale{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
  /* v6: cartelito que sigue al avión en pantalla (rumbo + altitud), aparte del
     panel general de la izquierda — se reposiciona cada frame proyectando la
     posición 3D del avión a coordenadas de pantalla (ver loop()). */
  #etiqueta-avion{position:absolute;transform:translate(-50%,-100%);
    background:rgba(15,20,32,.85);border:1px solid var(--cyan);border-radius:6px;
    padding:3px 9px;font-family:var(--font-mono);font-size:11px;color:var(--text);
    white-space:nowrap;pointer-events:none;z-index:5}
  #etiqueta-avion::after{content:'';position:absolute;left:50%;bottom:-5px;
    transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--cyan)}
  footer{flex-shrink:0;background:var(--bg3);border-top:1px solid var(--border);
    padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:var(--font-mono);font-size:12px}
  footer button{background:#0f1420;border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:12px}
  footer button:hover{border-color:var(--cyan);color:var(--cyan)}
  #play{width:40px;text-align:center}
  #slider{flex:1;min-width:120px;accent-color:var(--cyan)}
  footer label{display:flex;align-items:center;gap:5px;color:var(--text2);white-space:nowrap}
  /* Toggle tipo switch en vez del checkbox nativo del navegador */
  .toggle{display:flex;align-items:center;gap:8px;color:var(--text2);white-space:nowrap;cursor:pointer;user-select:none}
  .toggle input{display:none}
  .toggle .track{width:34px;height:18px;border-radius:999px;background:#2a3346;border:1px solid var(--border);
    position:relative;flex-shrink:0;transition:background .15s}
  .toggle .track::after{content:'';position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;
    background:var(--text2);transition:transform .15s,background .15s}
  .toggle input:checked + .track{background:var(--cyan);border-color:var(--cyan)}
  .toggle input:checked + .track::after{transform:translateX(16px);background:#0a0e16}
  select{background:#0f1420;border:1px solid var(--border);color:var(--text);border-radius:5px;
    padding:5px 6px;font-family:inherit;font-size:12px}
  header .volver{font-family:var(--font-mono);font-size:11px;color:var(--text3);text-decoration:none;
    border:1px solid var(--border);border-radius:4px;padding:3px 9px;margin-left:auto}
  header .volver:hover{color:var(--cyan);border-color:var(--cyan)}
  #carga{height:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(to bottom,#dff3fa 0%,#86cbe8 40%,#3f9dc7 100%)}
  #carga .caja{font-family:var(--font-mono);font-size:13px;color:var(--text);text-align:center;
    background:rgba(15,20,32,.85);border:1px solid var(--border);border-radius:10px;padding:20px 26px}
  #carga .error-box{border-color:#e0554a;color:#ffb4ac}
  #carga .error-box b{color:#ff6b5e}
</style>

<body>

    <label class="toggle"><input type="checkbox" id="humo" checked><span class="track"></span>Humo</label>
    <label class="toggle"><input type="checkbox" id="rosa" checked><span class="track"></span>Rosa de rumbos</label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ============================================================================
// 0) BOOTSTRAP: parámetro ?key= de la URL + lectura de /vuelo_tracks/{key}
// ============================================================================
// Solo lectura (reglas de la base son públicas) — REST directo a la Realtime
// Database, sin cargar el SDK completo de Firebase, que no hace falta acá.
const DB_URL = 'https://turnos-lv-oad-default-rtdb.firebaseio.com';
const urlParams = new URLSearchParams(location.search);
const trackKey = urlParams.get('key');
const elCarga = document.getElementById('carga');
const elApp = document.getElementById('app');
const elNota = document.getElementById('nota-vuelo');

function mostrarError(msg){
  elCarga.innerHTML = '<div class="caja error-box">✗ '+msg+'</div>';
}

if(!trackKey){
  mostrarError('Falta el parámetro <b>?key=</b> en la URL — este visor necesita<br>la key de la reserva para saber qué traza mostrar.');
} else {
  fetch(`${DB_URL}/vuelo_tracks/${trackKey}.json`)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(async data => {
      if(!data || !data.puntos || data.puntos.length < 3){
        mostrarError('Este vuelo no tiene traza GPS registrada<br>(o tiene muy pocos puntos para reconstruirla).');
        return;
      }
      const track = procesarPuntos(data.puntos);
      if(elNota){
        // v1.1 FIX (reportado por Daniel): vuelo_tracks/{key}.autor es el
        // INSTRUCTOR que cargó el vuelo, no el alumno/piloto — ese nombre vive
        // en /reservas/{key}, no acá. turnos.html ya lo pasa por query string
        // (?titulo=&sub=, tomado directo del modal del mapa); si la página se
        // abre sin esos parámetros (ej. link directo con solo ?key=), se
        // busca la reserva como respaldo en vez de mostrar el autor incorrecto.
        const titulo = urlParams.get('titulo'), sub = urlParams.get('sub');
        if(titulo){
          elNota.textContent = [titulo, sub].filter(Boolean).join(' · ');
        } else {
          let nombreRespaldo = '';
          try{
            const r = await fetch(`${DB_URL}/reservas/${trackKey}.json`);
            const reserva = r.ok ? await r.json() : null;
            if(reserva) nombreRespaldo = [reserva.nombre, reserva.avion].filter(Boolean).join(' — ');
          }catch(e){ /* sin respaldo posible, seguimos igual */ }
          const fecha = data.ts_guardado ? new Date(data.ts_guardado).toLocaleDateString('es-AR') : '';
          elNota.textContent = [nombreRespaldo, fecha].filter(Boolean).join(' · ') || 'Traza GPS';
        }
      }
      elCarga.style.display = 'none';
      elApp.style.display = 'flex';
      iniciarVisor(track);
    })
    .catch(err => {
      mostrarError('No se pudo leer la traza (' + err.message + ').');
    });
}

// ============================================================================
// 1) PROCESAMIENTO DE PUNTOS REALES
// ----------------------------------------------------------------------------
// A diferencia del track sintético del prototipo, acá los puntos vienen crudos
// de /vuelo_tracks/{key}.puntos = [{lat,lng,alt,ts}, ...] — sin heading, sin
// groundspeed, sin vertical speed. Todo eso se deriva entre puntos consecutivos,
// y el ruido normal del GPS (±unos metros de posición, ±10-30ft de altitud)
// hace que ese cálculo tiemble si no se suaviza — por eso el suavizado entra
// desde acá, no como mejora posterior.
// ============================================================================
/* ===================== CHEQUEO DE VERSION (mismo patrón que turnos.html) =====================
   Si alguien deja esta pestaña abierta (o la tiene guardada como acceso directo), nunca vuelve a
   pedirle el HTML al servidor por su cuenta — corre para siempre el JS que tenía cargado en
   memoria, sin importar qué fixes se suban después. Cada VERSION_POLL_MS se vuelve a pedir este
   mismo archivo con cache-buster y se compara la versión del badge contra la de esta pestaña. */
function extraerVersionDeHTML(html){
  const m = html.match(/<span class="badge" id="ver-badge">([^<]*)<\/span>/);
  return m ? m[1] : null;
}
const VERSION_ACTUAL = document.getElementById('ver-badge')?.textContent || null;
const VERSION_POLL_MS = 5*60*1000; // 5 minutos
let _versionDesactualizada = false;
async function chequearVersionNueva(){
  if(_versionDesactualizada || !VERSION_ACTUAL) return;
  try{
    const r = await fetch(location.pathname+'?_v='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const html = await r.text();
    const versionServidor = extraerVersionDeHTML(html);
    if(versionServidor && versionServidor!==VERSION_ACTUAL){
      _versionDesactualizada = true;
      const b = document.getElementById('banner-version-nueva');
      if(b) b.style.display = 'flex';
    }
  }catch(e){ console.warn('No se pudo chequear si hay una versión nueva:', e); }
}
document.getElementById('btn-recargar-version')?.addEventListener('click', ()=>{
  location.href = location.pathname+location.search+(location.search?'&':'?')+'_v='+Date.now();
});
setInterval(chequearVersionNueva, VERSION_POLL_MS);
setTimeout(chequearVersionNueva, 5000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') chequearVersionNueva(); });

function procesarPuntos(puntosCrudos){
  const G = 9.81;
  const R = 6371000; // radio terrestre, para la proyección local ENU
  const pts = puntosCrudos.slice().sort((a,b) => new Date(a.ts) - new Date(b.ts));
  const lat0 = pts[0].lat, lng0 = pts[0].lng, lat0Rad = lat0*Math.PI/180;

  // lat/lng/alt -> x(este)/y(altitud)/z(norte) en metros, locales al primer punto
  const base = pts.map(p => ({
    tRaw: new Date(p.ts).getTime()/1000,
    x: R*(p.lng-lng0)*Math.PI/180*Math.cos(lat0Rad),
    z: R*(p.lat-lat0)*Math.PI/180,
    y: p.alt != null ? p.alt : 0,
  }));
  const t0 = base[0].tRaw;
  for(const b of base) b.t = b.tRaw - t0;

  // FIX crítico con datos reales: el track sintético del prototipo nunca tenía
  // dos puntos idénticos seguidos, pero un vuelo real sí — sobre todo en
  // rodaje/espera en cabecera antes de despegar, donde el GPS repite casi la
  // misma posición muchas veces seguidas. CatmullRomCurve3/TubeGeometry
  // producen NaN con tramos de longitud cero entre puntos consecutivos, y eso
  // puede tirar abajo el render COMPLETO (no solo ese tramo) — se filtran acá
  // los puntos que no se movieron lo suficiente, salvo que ya haya pasado
  // bastante tiempo (para no perder del todo los tramos realmente detenidos).
  const filtrados = [base[0]];
  for(let i=1; i<base.length; i++){
    const prev = filtrados[filtrados.length-1];
    const dx=base[i].x-prev.x, dz=base[i].z-prev.z;
    const distXZ = Math.sqrt(dx*dx+dz*dz);
    if(distXZ > 0.3 || (base[i].t-prev.t) > 30) filtrados.push(base[i]);
  }
  const base2 = filtrados;

  // Despicado de altitud (pedido de Daniel): un salto de GPS de 1-2 lecturas
  // (ruido típico en altitud, más que en posición horizontal) se veía como un
  // quiebre feo en el tubo. En vez de fijar un límite arbitrario de "tasa
  // vertical máxima" (que habría que ir ajustando según el avión), un filtro
  // de MEDIANA en ventana de 5 muestras vota en contra del outlier con el
  // resto de la ventana y lo descarta solo — mucho más robusto para esto que
  // un promedio (que un solo pico grande ya distorsiona).
  function medianaEnVentana(arr, radio=2){
    const out = new Array(arr.length);
    for(let i=0; i<arr.length; i++){
      const vals=[];
      for(let k=-radio; k<=radio; k++){ const j=i+k; if(j>=0 && j<arr.length) vals.push(arr[j]); }
      vals.sort((a,b)=>a-b);
      out[i] = vals[Math.floor(vals.length/2)];
    }
    return out;
  }
  // v1.17: la mediana en una sola pasada con ventana de 5 (radio=2) solo vota
  // en contra de UN outlier aislado por ventana — un glitch de GPS que dura
  // 2-3 lecturas seguidas (típico cerca de pista, multipath) la puede pasar
  // de largo, y eso es justo lo que reportó Daniel: un pico altísimo en el
  // tubo en pleno circuito de pista. Se aplica la mediana DOS VECES: primero
  // con ventana ancha (radio=4, 9 muestras) para tener margen de votar en
  // contra de clusters de varios puntos corridos, después con la ventana
  // angosta original (radio=2) para terminar de limpiar bordes que la
  // primera pasada haya dejado escalonados.
  const altitudDespicada = medianaEnVentana(medianaEnVentana(base2.map(p=>p.y), 4), 2);

  // Segundo paso de suavizado (pedido de Daniel): la mediana solo saca picos
  // aislados de a uno, pero no "empareja" el resto — el ruido normal del GPS
  // entre punto y punto seguía notándose como vibración/turbulencia en la
  // curva. Se le suma acá un promedio móvil (ventana ±3) aplicado DOS veces
  // sobre la altitud ya despicada. Dos pasadas de una ventana angosta
  // suavizan más parejo que una sola pasada con una ventana ancha (que
  // "achata" curvas reales de ascenso/descenso de forma más notoria) —
  // arriman el resultado a lo que da un filtro gaussiano, sin la complejidad
  // de implementar uno.
  function promedioMovil(arr, radio){
    const out = new Array(arr.length);
    for(let i=0; i<arr.length; i++){
      let suma=0, cont=0;
      for(let k=-radio; k<=radio; k++){ const j=i+k; if(j>=0 && j<arr.length){ suma+=arr[j]; cont++; } }
      out[i] = suma/cont;
    }
    return out;
  }
  const altitudSuave = promedioMovil(promedioMovil(altitudDespicada, 3), 3);
  for(let i=0; i<base2.length; i++) base2[i].y = altitudSuave[i];

  // Heading/GS/VS crudos, por diferencia entre puntos consecutivos
  const n = base2.length;
  const rawHdg = new Array(n).fill(0), rawGs = new Array(n).fill(0), rawVs = new Array(n).fill(0);
  for(let i=1; i<n; i++){
    const a=base2[i-1], b=base2[i];
    const dt = b.t-a.t;
    if(dt<=0){ rawHdg[i]=rawHdg[i-1]; rawGs[i]=rawGs[i-1]; rawVs[i]=rawVs[i-1]; continue; }
    const dx=b.x-a.x, dz=b.z-a.z, dy=b.y-a.y;
    rawGs[i] = Math.sqrt(dx*dx+dz*dz)/dt;
    rawVs[i] = dy/dt;
    let hdg = Math.atan2(dx,dz)*180/Math.PI;
    if(hdg<0) hdg += 360;
    rawHdg[i] = hdg;
  }
  rawHdg[0]=rawHdg[1]||0; rawGs[0]=rawGs[1]||0; rawVs[0]=rawVs[1]||0;

  // Suavizado — ventana de ±2 muestras. El heading usa promedio CIRCULAR (por
  // vectores unitarios) para no romper en el cruce 0°/360° (un promedio lineal
  // ingenuo entre 350° y 10° daría 180°, exactamente al revés).
  function suavizarLineal(arr){
    const out = new Array(arr.length);
    for(let i=0; i<arr.length; i++){
      let suma=0, cont=0;
      for(let k=-2; k<=2; k++){ const j=i+k; if(j>=0 && j<arr.length){ suma+=arr[j]; cont++; } }
      out[i] = suma/cont;
    }
    return out;
  }
  function suavizarHeading(arrDeg){
    const out = new Array(arrDeg.length);
    for(let i=0; i<arrDeg.length; i++){
      let sx=0, sy=0, cont=0;
      for(let k=-2; k<=2; k++){
        const j=i+k;
        if(j>=0 && j<arrDeg.length){ const r=arrDeg[j]*Math.PI/180; sx+=Math.cos(r); sy+=Math.sin(r); cont++; }
      }
      let h = Math.atan2(sy/cont, sx/cont)*180/Math.PI;
      if(h<0) h += 360;
      out[i] = h;
    }
    return out;
  }
  const hdgSuave = suavizarHeading(rawHdg);
  const gsSuave = suavizarLineal(rawGs);
  const vsSuave = suavizarLineal(rawVs);

  function difHeading(a,b){ let d=b-a; while(d>180) d-=360; while(d<-180) d+=360; return d; }

  // Igual que el prototipo: bank por viraje coordinado, pitch por Vs/GS —
  // pero ahora con los valores YA suavizados en vez de los sintéticos exactos.
  const track = [];
  for(let i=0; i<n; i++){
    const dt = i>0 ? (base2[i].t-base2[i-1].t) : (base2[1] ? base2[1].t-base2[0].t : 1);
    const turnRateDegS = (i>0 && dt>0) ? difHeading(hdgSuave[i-1], hdgSuave[i])/dt : 0;
    const gsSafe = Math.max(gsSuave[i], 1.5);
    const bank = Math.atan(gsSuave[i]*(turnRateDegS*Math.PI/180)/G);
    const pitch = Math.atan(vsSuave[i]/gsSafe);
    track.push({t:base2[i].t, x:base2[i].x, y:base2[i].y, z:base2[i].z, hdgDeg:hdgSuave[i], bank, pitch, gs:gsSuave[i], vs:vsSuave[i]});
  }
  // resta la altitud MÍNIMA de este vuelo (no una elevación fija de aeródromo)
  // para que la traza arranque siempre pegada al "piso" del visor
  const yMin = Math.min(...track.map(p => p.y));
  for(const p of track) p.y -= yMin;

  // Recorte pedido por Daniel: trazar solo desde que despega. Arranca en el
  // primer punto que alcanza/supera 100ft (ya AGL, porque p.y ya está relativo
  // al punto más bajo de ESTE vuelo — ver arriba). Termina en el aterrizaje
  // FINAL: el último cruce hacia abajo de 100ft que se sostiene al menos 3
  // minutos — así no corta en un touch-and-go, que baja de 100ft solo un
  // instante y vuelve a subir.
  const UMBRAL_M = 100*0.3048; // ~30.48m
  let idxInicio = track.findIndex(p => p.y >= UMBRAL_M);
  if(idxInicio === -1) idxInicio = 0; // nunca llegó a 100ft — no recortamos nada, mejor mostrar todo

  let idxFin = track.length-1;
  for(let i=1; i<track.length; i++){
    const bajoAhora = track[i].y < UMBRAL_M, arribaAntes = track[i-1].y >= UMBRAL_M;
    if(bajoAhora && arribaAntes){
      const tCorte = track[i].t;
      let vuelveASubir = false;
      for(let j=i; j<track.length && track[j].t-tCorte<180; j++){
        if(track[j].y >= UMBRAL_M){ vuelveASubir=true; break; }
      }
      if(!vuelveASubir) idxFin = i; // aterrizaje válido — sigue buscando por si hay uno más tardío
    }
  }

  let recortado = track.slice(idxInicio, idxFin+1);
  if(recortado.length < 3) recortado = track; // salvaguarda: recorte demasiado agresivo, mostrar todo
  const tBase = recortado[0].t;
  for(const p of recortado) p.t -= tBase; // re-basar el tiempo a 0 en el nuevo primer punto
  // Pedido de Daniel: mostrar hora real (UTC, como el resto de la app) en el
  // panel de la izquierda. t0 es la hora absoluta del primer punto CRUDO
  // (antes de cualquier recorte); t0+tBase es la del nuevo punto 0 (ya
  // recortado). De ahí en más, cualquier t relativo del track solo necesita
  // sumarse a este ancla para reconstruir la hora real de ESE instante.
  recortado.epocaInicioSeg = t0 + tBase;
  recortado.origenGeo = {lat0, lng0, R};
  return recortado;
}

// --- Suelo: textura de pasto/tierra generada por canvas (parches grandes de
// color + speckle fino, tileable) — pedido de Daniel para que deje de verse
// como un degradado liso y parezca más terreno real. Sigue siendo una
// referencia visual, no datos satelitales reales (ver pregunta del mapa 2D
// como suelo, respondida aparte). ---
function texturaSuelo(){
  const size=512;
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#6f5a3a';
  ctx.fillRect(0,0,size,size);
  // Parches grandes (baja frecuencia) — zonas de pasto más verde o tierra más
  // pelada, para que no se vea uniforme visto de lejos.
  const tonosParche = ['#7c9a52','#5f7a3d','#8a6b42','#5e4a30','#93764a'];
  for(let i=0;i<40;i++){
    const x=Math.random()*size, y=Math.random()*size, r=20+Math.random()*70;
    ctx.globalAlpha = 0.18+Math.random()*0.18;
    ctx.fillStyle = tonosParche[Math.floor(Math.random()*tonosParche.length)];
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*(0.6+Math.random()*0.6), Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Speckle fino (alta frecuencia) — da la sensación de pasto/tierra granulada
  // cuando la cámara está cerca, sin quedar como ruido puro visto de lejos.
  for(let i=0;i<3500;i++){
    const x=Math.random()*size, y=Math.random()*size;
    const esVerde = Math.random()<0.55;
    ctx.fillStyle = esVerde
      ? `rgba(${90+Math.random()*60|0},${120+Math.random()*60|0},${40+Math.random()*40|0},0.5)`
      : `rgba(${100+Math.random()*70|0},${75+Math.random()*40|0},${40+Math.random()*30|0},0.5)`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// --- Rosa de rumbos en el suelo (pedido de Daniel, referencia visual de norte) ---
// Se arma con geometría en coordenadas de MUNDO (X,Z) directamente, en vez de
// un plano con textura rotado — así no hay que pelear con la orientación de
// un UV mapping después de rotation.x. La convención de rumbo de esta app ya
// está fijada más abajo, en el cálculo de rawHdg: hdg=0 (Norte) es +Z, hdg=90
// (Este) es +X (atan2(dx,dz), con dx=0,dz>0 → 0°; dx>0,dz=0 → 90°). Acá se usa
// la misma convención para que la rosa quede alineada con el rumbo real del
// avión en la traza.
function _crearTexturaLetra(letra){
  const size=128;
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const ctx=c.getContext('2d');
  // v1.25 FIX: el canvas entero se espeja con transform:scaleX(-1) (v1.24)
  // para corregir el este-oeste general — pero eso también espeja el TEXTO
  // de estos sprites (una "N" se dibuja como una "N" al revés, ilegible).
  // Se pre-espeja acá mismo el dibujo de la letra (scale(-1,1) antes de
  // escribir) para que, después del espejo global del canvas, se lea
  // normal. La posición en el mundo NO se toca — esto es puro dibujo 2D
  // dentro de la textura.
  ctx.translate(size, 0);
  ctx.scale(-1, 1);
  ctx.font='bold 92px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#e8b84b';
  ctx.strokeStyle='rgba(10,14,22,0.9)'; ctx.lineWidth=10;
  ctx.strokeText(letra, size/2, size/2+4);
  ctx.fillText(letra, size/2, size/2+4);
  return new THREE.CanvasTexture(c);
}
function construirRosaRumbos(){
  const g = new THREE.Group();
  // v1.17 FIX: Daniel reportó que no se veía — con radio=extent*0.025 quedaba
  // microscópica contra vuelos de varios km (el resto de las referencias en
  // el suelo, como camRadioLibre, usan multiplicadores 10-100x mayores). Subo
  // el multiplicador y agrego un piso absoluto para vuelos cortos (patrones/
  // circuitos), y fuerzo depthTest:false + renderOrder alto para que nunca
  // quede tapada por el suelo/grilla/tubo por z-fighting.
  const radio = Math.max(60, extent*0.12);
  const y = 0.12; // apenas por encima de la grilla (0.05)

  // Aro exterior
  const puntosAro = [];
  for(let i=0; i<=64; i++){
    const a = (i/64)*Math.PI*2;
    puntosAro.push(new THREE.Vector3(centro.x+radio*Math.sin(a), y, centro.z+radio*Math.cos(a)));
      // sin/cos así (no cos/sin) porque acá el ángulo "a" ya se usa como rumbo:
      // a=0 → (0,·,radio) = +Z = Norte; a=90° → (radio,·,0) = +X = Este.
  }
  const aro = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(puntosAro),
    new THREE.LineBasicMaterial({color:0xd9c19a, transparent:true, opacity:0.75, depthTest:false})
  );
  aro.renderOrder = 5;
  g.add(aro);

  // Marcas radiales cada 30°, más largas en los 4 cardinales
  const marcas = [];
  for(let i=0; i<12; i++){
    const a = (i/12)*Math.PI*2;
    const esCardinal = i%3===0;
    const rInt = radio*(esCardinal ? 0.80 : 0.90);
    marcas.push(new THREE.Vector3(centro.x+rInt*Math.sin(a), y, centro.z+rInt*Math.cos(a)));
    marcas.push(new THREE.Vector3(centro.x+radio*Math.sin(a), y, centro.z+radio*Math.cos(a)));
  }
  const marcasLine = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(marcas),
    new THREE.LineBasicMaterial({color:0xd9c19a, transparent:true, opacity:0.75, depthTest:false})
  );
  marcasLine.renderOrder = 5;
  g.add(marcasLine);

  // Triángulos indicadores en N (rojo) y S (blanco), como en una rosa de
  // rumbos/VOR real — apuntan HACIA AFUERA (la punta más lejos del centro
  // que la base), pedido de Daniel.
  function construirTriangulo(hdgDeg, color){
    const a = hdgDeg*Math.PI/180;
    const dirX=Math.sin(a), dirZ=Math.cos(a);       // radial, hacia afuera
    const perpX=Math.cos(a), perpZ=-Math.sin(a);    // perpendicular, para la base
    const rPunta = radio*1.05, rBase = radio*0.75, semiAncho = radio*0.11;
    const punta     = new THREE.Vector3(centro.x+dirX*rPunta, y, centro.z+dirZ*rPunta);
    const baseIzq   = new THREE.Vector3(centro.x+dirX*rBase+perpX*semiAncho, y, centro.z+dirZ*rBase+perpZ*semiAncho);
    const baseDer   = new THREE.Vector3(centro.x+dirX*rBase-perpX*semiAncho, y, centro.z+dirZ*rBase-perpZ*semiAncho);
    const geo = new THREE.BufferGeometry().setFromPoints([punta, baseIzq, baseDer]);
    const mat = new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide, depthTest:false});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 5;
    return mesh;
  }
  g.add(construirTriangulo(0, 0xd0342c));   // Norte, rojo
  g.add(construirTriangulo(180, 0xf2f2f2)); // Sur, blanco

  // Letras N/E/S/O como sprites (encaran siempre a cámara, no hace falta
  // orientarlas) ubicadas un poco afuera del aro, en su rumbo correspondiente.
  const cardinales = [['N',0],['E',90],['S',180],['O',270]];
  const tamLetra = radio*0.32;
  for(const [letra, hdgDeg] of cardinales){
    const a = hdgDeg*Math.PI/180;
    const mat = new THREE.SpriteMaterial({map:_crearTexturaLetra(letra), transparent:true, depthWrite:false, depthTest:false});
    const sprite = new THREE.Sprite(mat);
    sprite.renderOrder = 6;
    sprite.scale.setScalar(tamLetra);
    sprite.position.set(centro.x+radio*1.18*Math.sin(a), y+tamLetra*0.3, centro.z+radio*1.18*Math.cos(a));
    g.add(sprite);
  }
  return g;
}

// --- Mapa satelital como suelo (opcional, pedido de Daniel: "probemos") ---
// Reusa el mismo proveedor de tiles que ya usan turnos.html/vuelo.html para
// el mapa GPS 2D (ArcGIS World_Imagery, sin API key). A diferencia del suelo
// de pasto (infinito, se recentra bajo la cámara), esto es una capa FINITA:
// solo cubre el área real del vuelo, georreferenciada invirtiendo la misma
// proyección ENU que ya usa el resto del visor (x=E, z=N desde lat0/lng0).
// Apagado por default: pide varias imágenes por red, no es gratis en tiempo
// de carga como el resto de los toggles (que son puro cálculo local).
function _lngLatATileFrac(lng, lat, zoom){
  const n = Math.pow(2, zoom);
  const x = (lng+180)/360*n;
  const latRad = lat*Math.PI/180;
  const y = (1 - Math.log(Math.tan(latRad)+1/Math.cos(latRad))/Math.PI)/2*n;
  return {x, y};
}
function _tileEsquinaLngLat(tx, ty, zoom){ // esquina noroeste del tile (tx,ty)
  const n = Math.pow(2, zoom);
  const lng = tx/n*360-180;
  const latRad = Math.atan(Math.sinh(Math.PI*(1-2*ty/n)));
  return {lat: latRad*180/Math.PI, lng};
}
function _elegirZoomYTiles(latMin, latMax, lngMin, lngMax){
  const TOPE_TILES = 100; // subido de 36 — con más cobertura (ver margen en
    // construirMapaSatelital) hacen falta más tiles para mantener buen zoom;
    // el costo es más pedidos de red al activar el toggle.
  let zoom = 17; // maxNativeZoom de World_Imagery en el resto de la app
  for(; zoom>=10; zoom--){
    const no = _lngLatATileFrac(lngMin, latMax, zoom);
    const se = _lngLatATileFrac(lngMax, latMin, zoom);
    const txMin=Math.floor(no.x), txMax=Math.floor(se.x);
    const tyMin=Math.floor(no.y), tyMax=Math.floor(se.y);
    if((txMax-txMin+1)*(tyMax-tyMin+1) <= TOPE_TILES) return {zoom,txMin,txMax,tyMin,tyMax};
  }
  const no = _lngLatATileFrac(lngMin, latMax, zoom+1);
  const se = _lngLatATileFrac(lngMax, latMin, zoom+1);
  return {zoom:zoom+1, txMin:Math.floor(no.x), txMax:Math.floor(se.x), tyMin:Math.floor(no.y), tyMax:Math.floor(se.y)};
}
async function construirMapaSatelital(){
  // bbox lat/lng del vuelo, invirtiendo la proyección ENU. Margen subido de
  // 15% a 75% (pedido de Daniel: que no se vea como un cuadrado chico y
  // limitado) — cubre un área bastante más allá de la traza en sí, para que
  // no se note el borde salvo que la cámara libre se aleje mucho. No puede
  // ser realmente "infinito" como el pasto (son tiles reales, hay que
  // pedirlos), así que el pasto se ve más allá de este radio.
  const margen = extent*0.75;
  const xMin=bb.minX-margen, xMax=bb.maxX+margen, zMin=bb.minZ-margen, zMax=bb.maxZ+margen;
  const lngDe = x => lng0 + x/(R*Math.cos(lat0Rad))*180/Math.PI;
  const latDe = z => lat0 + z/R*180/Math.PI;
  const lngMin=lngDe(xMin), lngMax=lngDe(xMax), latMin=latDe(zMin), latMax=latDe(zMax);

  const {zoom,txMin,txMax,tyMin,tyMax} = _elegirZoomYTiles(latMin,latMax,lngMin,lngMax);
  const nx=txMax-txMin+1, ny=tyMax-tyMin+1;
  const canvas = document.createElement('canvas');
  canvas.width = nx*256; canvas.height = ny*256;
  const ctx = canvas.getContext('2d');
  let ok=0, fail=0;
  const promesas = [];
  for(let ty=tyMin; ty<=tyMax; ty++){
    for(let tx=txMin; tx<=txMax; tx++){
      const img = new Image();
      img.crossOrigin = 'anonymous';
      const px=(tx-txMin)*256, py=(ty-tyMin)*256;
      const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ty}/${tx}`;
      promesas.push(new Promise(resolve=>{
        img.onload = ()=>{ ctx.drawImage(img,px,py,256,256); ok++; resolve(); };
        img.onerror = ()=>{ fail++; console.warn('[mapaSat] falló el tile', url); resolve(); };
          // tile que falló: queda el hueco transparente, no rompe el resto —
          // pero si fallan MUCHOS, avisamos abajo (posible bloqueo CORS del
          // servidor de tiles al pedirlos con crossOrigin, necesario para
          // poder dibujarlos en un canvas/textura de WebGL).
      }));
      img.src = url;
    }
  }
  await Promise.all(promesas);
  console.log(`[mapaSat] zoom=${zoom} tiles=${nx*ny} ok=${ok} fail=${fail} bbox=`, {latMin,latMax,lngMin,lngMax});
  if(fail > ok){
    const avisoMapa = document.createElement('div');
    avisoMapa.className = 'panel';
    avisoMapa.style.cssText = 'top:12px;left:50%;transform:translateX(-50%);max-width:520px;color:#ffb4ac;border-color:#e0554a;text-align:center';
    avisoMapa.innerHTML = `⚠ Mapa satelital: fallaron ${fail} de ${nx*ny} tiles (¿bloqueo CORS del servidor de tiles? mirá la consola) — puede verse incompleto o mal ubicado.`;
    document.getElementById('stage').appendChild(avisoMapa);
  }

  // Esquinas REALES del mosaico (no del bbox pedido, que se redondeó a tiles
  // enteros) — hay que georreferenciar contra estas, si no el mapa queda
  // corrido respecto de la traza.
  const no = _tileEsquinaLngLat(txMin, tyMin, zoom);
  const se = _tileEsquinaLngLat(txMax+1, tyMax+1, zoom);
  const xOeste = R*(no.lng-lng0)*Math.PI/180*Math.cos(lat0Rad);
  const xEste  = R*(se.lng-lng0)*Math.PI/180*Math.cos(lat0Rad);
  const zNorte = R*(no.lat-lat0)*Math.PI/180;
  const zSur   = R*(se.lat-lat0)*Math.PI/180;

  // DEBUG (Daniel reportó offset de varias millas al SE) — con esto en
  // consola se puede: (1) pegar lat0/lng0 en Google Maps y confirmar si el
  // ORIGEN del vuelo (primer punto GPS crudo) está realmente donde debería,
  // y (2) abrir la URL del tile central directo en el navegador para
  // confirmar si ArcGIS está devolviendo la imagen de la zona correcta —
  // separa un posible error de GPS/origen de un posible error mío de cálculo
  // de qué tile pedir.
  console.log('[mapaSat] origen del vuelo (lat0,lng0):', lat0, lng0);
  console.log('[mapaSat] esquina NO real:', no, '/ esquina SE real:', se);
  const tyMedio = Math.round((tyMin+tyMax)/2), txMedio = Math.round((txMin+txMax)/2);
  console.log('[mapaSat] tile central (abrir para ver qué zona muestra):',
    `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${tyMedio}/${txMedio}`);

  const tex = new THREE.CanvasTexture(canvas);
  // La malla rota -90° en X igual que el suelo/grilla/rosa: con flipY por
  // defecto (fila 0 de la imagen → V=1 → local +Y → mundo -Z, ver rosa de
  // rumbos más arriba) el norte de la imagen caería al SUR del mundo. Se
  // desactiva flipY para que fila 0 (norte real) quede en local -Y → +Z.
  tex.flipY = false;

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(xEste-xOeste, zNorte-zSur),
    // v1.22 FIX: el depthTest:false de v1.21 arreglaba el rayado contra el
    // pasto, pero como ese material ignora TODO lo ya dibujado (no solo el
    // pasto), y este mesh tiene renderOrder=1 (más alto que el default=0 del
    // avión/tubo/postes/humo), terminaba pintándose ENCIMA de esos también,
    // sin importar que estuvieran más cerca de cámara — por eso Daniel vio
    // el avión "transparente". Se saca depthTest:false y en cambio se separa
    // bastante más en Y del pasto (ver más abajo): a esta escala (kilómetros
    // desde el origen) 0.1 de diferencia no alcanzaba para que el depth
    // buffer los distinga, pero unos metros de separación sí, sin necesidad
    // de saltarse el testeo de profundidad (que es lo que rompía el avión).
    new THREE.MeshBasicMaterial({map:tex})
  );
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set((xOeste+xEste)/2, -0.15, (zNorte+zSur)/2);
  return mesh;
}

// --- Escala de color ---
function colorPara(valor, min, max){
  const t = Math.max(0, Math.min(1, (valor-min)/(max-min || 1)));
  const hue = (1-t)*240;
  return new THREE.Color().setHSL(hue/360, 0.85, 0.5);
}
let modoColor = 'alt';
const altMin = bb.minY, altMax = bb.maxY;
let gsMin = Infinity, gsMax = -Infinity;
for(const p of track){ gsMin=Math.min(gsMin,p.gs); gsMax=Math.max(gsMax,p.gs); }
function valorColor(p){ return modoColor==='alt' ? p.y : p.gs; }
function rangoColor(){ return modoColor==='alt' ? [altMin,altMax] : [gsMin,gsMax]; }

// --- Tubo de la traza. v2: radio bastante más grande (antes ~extent*0.0025,
// invisible salvo casi encima) y MeshStandardMaterial en vez de MeshBasicMaterial
// — Basic ignora la luz, entonces el cilindro se veía como una cinta plana de un
// solo color en vez de leerse como un tubo redondo; con luz ahora tiene sombreado
// que sugiere el volumen. ---
let tuboGroup = new THREE.Group();
scene.add(tuboGroup);
let RADIO_TUBO = Math.max(1.5, extent*0.0016); // -50% que antes (3 / 0.0032)

// v5: antes se armaba un cilindro CORTO por cada par de puntos consecutivos —
// cada unión entre uno y el siguiente quedaba como un corte/quiebre visible
// (se nota sobre todo en los tramos curvos). Ahora es un único TubeGeometry
// sobre una curva suave (CatmullRom) que pasa por todos los puntos del track,
// con el color interpolado por vértice a lo largo de la curva en vez de un
// color plano por segmento — la transición de color también queda continua.
const curvaTrack = new THREE.CatmullRomCurve3(track.map(p=>new THREE.Vector3(p.x, ry(p.y), p.z)));
const TUBULAR_SEGMENTS = Math.max(200, track.length*2);
const RADIAL_SEGMENTS = 8;

function valorEnU(u){
  // FIX: TubeGeometry samplea la curva por LONGITUD DE ARCO (u), no por
  // índice de punto — con velocidad casi constante (el track sintético del
  // prototipo) esto pasaba desapercibido, pero con datos reales de velocidad
  // variable (sobre todo en un viraje, donde los puntos quedan mucho más
  // juntos en el espacio) "u" y "fracción de índice" dejan de coincidir, y el
  // color del tubo en un punto dado deja de corresponder al valor real de ESE
  // punto. getUtoTmapping() convierte u (arco) a t (el mismo parámetro que ya
  // usa getPoint() internamente, que sí es lineal por índice de punto).
  const t = curvaTrack.getUtoTmapping(u);
  const idxF = t*(track.length-1);
  const i = Math.min(track.length-2, Math.floor(idxF));
  const f = idxF-i;
  const a=track[i], b=track[i+1];
  return valorColor(a)+(valorColor(b)-valorColor(a))*f;
}

function reconstruirTubo(){
  tuboGroup.clear();
  const [min,max] = rangoColor();
  const geo = new THREE.TubeGeometry(curvaTrack, TUBULAR_SEGMENTS, RADIO_TUBO, RADIAL_SEGMENTS, false);
  // TubeGeometry arma sus vértices en anillos: (TUBULAR_SEGMENTS+1) anillos de
  // (RADIAL_SEGMENTS+1) vértices cada uno, en ese orden — coloreamos anillo por
  // anillo con el mismo valor (todos los vértices de un anillo comparten
  // posición a lo largo del tubo, solo cambian alrededor de la circunferencia).
  const colores = new Float32Array((TUBULAR_SEGMENTS+1)*(RADIAL_SEGMENTS+1)*3);
  let idx=0;
  for(let iu=0; iu<=TUBULAR_SEGMENTS; iu++){
    const col = colorPara(valorEnU(iu/TUBULAR_SEGMENTS), min, max);
    for(let iv=0; iv<=RADIAL_SEGMENTS; iv++){
      colores[idx++]=col.r; colores[idx++]=col.g; colores[idx++]=col.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colores,3));
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.55, metalness:0.05, transparent:true, opacity:0.8});
  tuboGroup.add(new THREE.Mesh(geo, mat));
}

const MODELO_ESCALA = Math.max(3, extent*0.0028); // FIX: antes fijo en 7 —
  // calibrado a ojo contra el extent (~2-3km) del track sintético del
  // prototipo. Con un vuelo real más largo/corto, un número fijo queda
  // desproporcionado — ahora escala junto con RADIO_TUBO (misma lógica).
const MODELO_ROTACION_Y_EXTRA = 0; // grados: ajustar si el morro no queda mirando hacia +Z
let _heliceRef = null; // nodo del buje de la hélice, para animarlo girando (ver loop)

// --- Estela de humo: sprites (se orientan a cámara solos, sin código extra)
// con una textura de puntito difuso generada por canvas — nada de archivos
// externos. Se emiten desde la cola mientras reproduce, se agrandan y se
// desvanecen con el tiempo, y se van descartando.
function _crearTexturaHumo(){
  const size=64;
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.45,'rgba(255,255,255,0.45)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const _humoTextura = _crearTexturaHumo();
const _humoParticulas = [];
let _humoDistAcumulada = 0; // acumulador de DISTANCIA (no de tiempo — ver v1.13)
let _humoPosAnterior = null;
const HUMO_VIDA_MAX = 20;     // tope de SEGURIDAD en segundos — solo actúa si el
  // avión tuviera velocidad ~0 sostenida (no debería pasar en vuelo real, el
  // track viene recortado a tramo aéreo), para que el humo no se acumule sin
  // límite. En vuelo normal, el que corta cada puff es HUMO_LARGO_OBJETIVO.
let AVION_LARGO_MUNDO = MODELO_ESCALA*4; // fallback hasta que cargue el GLB
  // real (se recalcula abajo con el bounding box del modelo)
const HUMO_LARGO_OBJETIVO_MULT = 3; // pedido de Daniel: la estela debe medir,
  // en distancia real recorrida por el avión, 3 "largos de avión" — no un
  // tiempo fijo (antes HUMO_VIDA=7s, sin relación con el tamaño real ni la
  // velocidad del avión: el mismo tiempo daba estelas de largo muy distinto
  // según qué tan rápido volara).
let HUMO_LARGO_OBJETIVO = AVION_LARGO_MUNDO*HUMO_LARGO_OBJETIVO_MULT;
const HUMO_TAM_MIN_MULT = 0.14, HUMO_TAM_MAX_MULT = 0.20; // tamaño de cada
  // puff, en fracción del largo del avión — pensado para que se vea FINO
  // (varios puffs distinguibles a lo largo de la estela) y no una sola bocha.
const HUMO_CRECIMIENTO = 0.5; // cuánto crece cada puff, del tamaño inicial al
  // final de su vida, a lo largo de SU AVANCE (0→1, por distancia — ver
  // HUMO_LARGO_OBJETIVO más abajo, no por tiempo real).
const HUMO_DERIVA_MAX_MULT = 0.35; // cuánto sube cada puff (fracción del
  // largo del avión) a lo largo de su avance — mismo criterio: por avance,
  // no por tiempo real.
const HUMO_MAX = 140; // tope de puffs simultáneos (protección de memoria/perf)
const HUMO_OFFSET_LOCAL = new THREE.Vector3(0, 1.4, 0.9).multiplyScalar(MODELO_ESCALA); // punto de
  // salida relativo al avión. Bajado de nuevo (2.0→1.4) — seguía alto.

function _emitirHumo(posMundo){
  const mat = new THREE.SpriteMaterial({map:_humoTextura, color:0xd8d8d8, transparent:true, opacity:0.5, depthWrite:false});
  const sprite = new THREE.Sprite(mat);
  // v1.14: tamaño atado SOLO a AVION_LARGO_MUNDO (la unidad de medida que
  // pidió Daniel), ya no a MODELO_ESCALA — son dos escalas relacionadas pero
  // no idénticas, y mezclarlas es lo que daba puffs desproporcionados contra
  // un objetivo de estela definido en "largos de avión".
  const tamOriginal = AVION_LARGO_MUNDO*(HUMO_TAM_MIN_MULT + Math.random()*(HUMO_TAM_MAX_MULT-HUMO_TAM_MIN_MULT));
  sprite.scale.setScalar(tamOriginal);
  const j = AVION_LARGO_MUNDO*0.10; // jitter de dispersión inicial
  sprite.position.copy(posMundo).add(new THREE.Vector3((Math.random()-0.5)*j,(Math.random()-0.5)*j,(Math.random()-0.5)*j));
  scene.add(sprite);
  _humoParticulas.push({sprite, edad:0, origen:sprite.position.clone(), tamOriginal}); // "origen" es el
    // punto del mundo donde se emitió — contra eso se mide, cada frame, cuánto
    // se alejó ya el avión (ver loop de render) para saber cuándo apagarlo.
  if(_humoParticulas.length>HUMO_MAX){
    const viejo=_humoParticulas.shift();
    scene.remove(viejo.sprite); viejo.sprite.material.dispose();
  }
}

new THREE.GLTFLoader().load('aeroplane.glb', (gltf)=>{
  const modelo = gltf.scene;

  // El archivo original traía un nodo "BG": un plano gigante (escala ~47x),
  // pensado como telón de fondo de una escena propia — no nos sirve acá,
  // tenemos nuestro propio cielo/suelo.
  const bg = modelo.children.find(n => n.name === 'BG');
  if (bg) modelo.remove(bg);

  // Recentrado: el origen del modelo no está en el centro del fuselaje (varía
  // según cómo lo haya modelado el autor) — lo centramos en X/Z y apoyamos su
  // punto más bajo (tren de aterrizaje) en Y=0, para que el pivote de
  // rotación quede donde lo necesitamos.
  const caja = new THREE.Box3().setFromObject(modelo);
  const centro = caja.getCenter(new THREE.Vector3());
  modelo.position.x -= centro.x;
  modelo.position.z -= centro.z;
  modelo.position.y -= caja.min.y;

  // Largo real nariz-cola del modelo: el eje Z local es hacia donde mira el
  // morro (ver MODELO_ROTACION_Y_EXTRA más arriba), así que el tamaño en Z del
  // bounding box —ya escalado por MODELO_ESCALA— es el "largo de avión" que
  // se usa como unidad de medida para el largo de la estela de humo.
  AVION_LARGO_MUNDO = caja.getSize(new THREE.Vector3()).z * MODELO_ESCALA;
  HUMO_LARGO_OBJETIVO = AVION_LARGO_MUNDO * HUMO_LARGO_OBJETIVO_MULT;

  modelo.rotation.y = MODELO_ROTACION_Y_EXTRA*Math.PI/180;
  modelo.scale.setScalar(MODELO_ESCALA);

  // El archivo solo trae UN ala (nodo "Plane") — no está espejada del lado
  // derecho. Se clona y se refleja en X (scale.x=-1) alrededor del mismo
  // punto de la raíz del ala, que en este modelo está ~sobre la línea central
  // del fuselaje. Three.js voltea automáticamente el sentido de las caras en
  // objetos con escala negativa, así que no hace falta tocar normales a mano.
  let ala = null;
  modelo.traverse(o=>{ if(o.userData && o.userData.name==='Plane') ala=o; });
  if(ala){
    const alaEspejada = ala.clone();
    alaEspejada.scale.x *= -1;
    ala.parent.add(alaEspejada);
  }

  // Mismo problema con la pata principal del tren de aterrizaje ("Circle.004",
  // desplazada a un lado del eje central) — la de cola ("Circle.005", casi
  // sobre el eje) sí viene sola porque es una sola rueda de cola, esa no se
  // espeja. A diferencia del ala (cuya geometría en sí ya se extendía de un
  // lado al otro desde x=0), acá la geometría de la rueda está centrada en su
  // propio origen y es la TRASLACIÓN del nodo (x=1.41) la que la manda al
  // costado — asique además de espejar la escala hay que espejar también esa
  // posición, si no la copia queda superpuesta en el mismo lugar que la
  // original en vez de cruzar al otro lado.
  let pataTren = null;
  modelo.traverse(o=>{ if(o.userData && o.userData.name==='Circle.004') pataTren=o; });
  if(pataTren){
    const pataEspejada = pataTren.clone();
    pataEspejada.position.x = -pataTren.position.x;
    pataEspejada.scale.x *= -1;
    pataTren.parent.add(pataEspejada);
  }

  // La rueda estaba flotando sin pata visible porque el "strut" que la une al
  // fuselaje es OTRO nodo separado ("Circle.003" — coincide en Z exacto con
  // "Circle.004", la rueda), y también viene sin espejar. Mismo fix.
  let strutTren = null;
  modelo.traverse(o=>{ if(o.userData && o.userData.name==='Circle.003') strutTren=o; });
  if(strutTren){
    const strutEspejado = strutTren.clone();
    strutEspejado.position.x = -strutTren.position.x;
    strutEspejado.scale.x *= -1;
    strutTren.parent.add(strutEspejado);
  }

  // Estabilizador horizontal: mismo problema que el ala (nodo "Circle.002"),
  // con la geometría misma extendida hacia un lado desde x≈0 en vez de un
  // desplazamiento por traslación — se espeja igual que el ala, sin tocar la
  // posición.
  let stabH = null;
  modelo.traverse(o=>{ if(o.userData && o.userData.name==='Circle.002') stabH=o; });
  if(stabH){
    const stabHEspejado = stabH.clone();
    stabHEspejado.scale.x *= -1;
    stabH.parent.add(stabHEspejado);
  }

  // El modelo se veía muy oscuro — la causa real no era la luz: los
  // materiales de color no traen "metallicFactor" en el archivo, y el default
  // del estándar glTF cuando falta ese campo es 1.0 (METAL PURO). Sin un mapa
  // de entorno para reflejar, un metal puro se ve casi negro salvo un brillo
  // puntual — por eso se veía tan oscuro pese a las luces. Forzamos
  // metalness=0 (acabado mate tipo "juguete", no metálico).
  modelo.traverse(o=>{
    if(o.isMesh && o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for(const mat of mats){
        if(mat.metalness!==undefined) mat.metalness = 0;
        if(mat.roughness!==undefined) mat.roughness = Math.min(mat.roughness, 0.55);
      }
    }
  });

  // Buje de la hélice (3 palas armadas como hijas de un mismo nodo) — si
  // aparece, lo giramos en el loop mientras se reproduce, de yapa.
  modelo.traverse(o=>{ if(o.userData && o.userData.name==='Circle.007') _heliceRef=o; });

  avion.add(modelo); // FIX: esta línea se había perdido en un refactor anterior —
    // el modelo se armaba entero (centrado, escalado, alas/tren arreglados) pero
    // nunca se agregaba a la escena, así que no tiraba ningún error y tampoco
    // se veía nada.

}, undefined, (err)=>{
  console.error('No se pudo cargar el modelo GLB del avión (aeroplane.glb):', err);
  // Aviso visible en pantalla — antes solo quedaba en la consola, y "no se ve
  // el avión" sin más pista obliga a pedir la consola cada vez para saber si
  // es esto o un problema de escala/posición.
  const avisoGlb = document.createElement('div');
  avisoGlb.className = 'panel';
  avisoGlb.style.cssText = 'top:12px;left:50%;transform:translateX(-50%);max-width:520px;color:#ffb4ac;border-color:#e0554a;text-align:center';
  avisoGlb.innerHTML = '⚠ No se pudo cargar el modelo 3D del avión (<code>aeroplane.glb</code>) — el resto del visor sigue funcionando igual. Confirmá que el archivo esté subido junto a esta página.';
  document.getElementById('stage').appendChild(avisoGlb);
});

// --- Postes verticales (opcionales), ahora como CINTAS semitransparentes con
// ancho (antes eran líneas de 1px, casi invisibles) — cada una toma el color
// que tendría el tubo en ese punto (según el modo Altitud/Velocidad activo), y
// se orienta ("billboard") hacia la cámara en cada frame para que siempre se
// vean de frente en vez de a veces de canto. ---
let postesGroup = null;
function construirPostes(){
  const g = new THREE.Group();
  const numPostes = Math.max(30, Math.round(extent/80)); // FIX: antes 50 fijo
    // sin importar el largo del vuelo — con un vuelo real más largo que el
    // track sintético, quedaban muy espaciados. Ahora la cantidad escala con
    // extent, la densidad se mantiene pareja sin importar la duración.
  const espaciado = Math.max(1, Math.round(track.length/numPostes));
  const ancho = Math.max(20, extent*0.01488); // +55% más que el valor anterior (13 / 0.0096)
  const [min,max] = rangoColor();
  for(let i=0;i<track.length;i+=espaciado){
    const p=track[i];
    // Umbral sobre la altitud REAL (no ry(), que la exagera 4x) — con el
    // ruido normal del GPS en rodaje (unos pocos metros de variación falsa),
    // un umbral chico sobre la altura YA exagerada dejaba pasar postes en el
    // piso. 3m (~10ft) es un piso razonable para considerar "en el aire" y de
    // paso evita gastar recursos dibujando postes en rodaje/recién aterrizado.
    if(p.y < 3) continue;
    const alturaRender = ry(p.y);
    // Trapecio en vez de rectángulo: el borde superior sigue la inclinación
    // real del tubo en ESE punto (mismo criterio que el pitch renderizado del
    // avión — EXAG_VERT exagera la pendiente igual que exagera la altura),
    // en vez de un corte plano a 90° que no acompaña la subida/bajada del
    // tubo. El ancho de la cinta ya está alineado con la dirección de avance
    // (ver rotation.y más abajo) — el lado derecho (+ancho/2) es "adelante",
    // el izquierdo "atrás", por eso la inclinación se reparte con signos
    // opuestos a cada lado.
    const pitchLocal = Math.atan(EXAG_VERT*Math.tan(p.pitch));
    const inclinacion = Math.tan(pitchLocal)*(ancho/2);
    const alturaDer = alturaRender+inclinacion, alturaIzq = alturaRender-inclinacion;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -ancho/2, 0,         0,
       ancho/2, 0,         0,
       ancho/2, alturaDer, 0,
      -ancho/2, alturaIzq, 0,
    ]), 3));
    geo.setIndex([0,1,2, 0,2,3]);
    const color = colorPara(valorColor(p), min, max);
    const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.32, side:THREE.DoubleSide, depthWrite:false});
    const cinta = new THREE.Mesh(geo, mat);
    cinta.position.set(p.x, 0, p.z);
    cinta.rotation.y = (p.hdgDeg-90)*Math.PI/180; // v13 FIX: usar el mismo ángulo
      // que el yaw del avión alineaba la NORMAL de la cinta con la traza (por eso
      // se veía de canto, transversal) — lo que hay que alinear es su eje de
      // ANCHO, que en una PlaneGeometry es el eje X local, 90° rotado respecto
      // de la normal (Z local). De ahí el -90 extra.
    g.add(cinta);
  }
  return g;
}

let camTheta = Math.PI*0.22, camPhi = Math.PI*0.40;

let camRadioSeguir = Math.max(180, extent*0.03);

const seguirChk = document.getElementById('seguir');

function aplicarZoom(deltaY){
  if(seguirChk.checked){
    camRadioSeguir = Math.max(30, Math.min(extent*1.5, camRadioSeguir*(1+deltaY*0.001)));
  } else {
    camRadioLibre = Math.max(50, Math.min(extent*6, camRadioLibre*(1+deltaY*0.001)));
  }
}

// --- Pointer Events unificados: mouse Y touch pasan por acá (a diferencia de
// "wheel", que solo existe para mouse/trackpad — un pinch de dos dedos nunca
// lo dispara, por eso el zoom no funcionaba en celular). Con 1 puntero activo
// se rota (arrastre); con 2, la distancia entre ambos maneja el zoom (pinch).
const _punterosActivos = new Map(); // pointerId -> {x,y}
let _pinchDistanciaPrevia = null;

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  _punterosActivos.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(_punterosActivos.size===1){
    dragging=true; lastX=e.clientX; lastY=e.clientY;
  } else {
    dragging=false; // 2° dedo apoyado: se corta el drag, pasa a modo pinch
    _pinchDistanciaPrevia = null;
  }
});
function _soltarPuntero(e){
  _punterosActivos.delete(e.pointerId);
  if(_punterosActivos.size<2) _pinchDistanciaPrevia = null;
  if(_punterosActivos.size===0) dragging=false;
}
window.addEventListener('pointerup', _soltarPuntero);
window.addEventListener('pointercancel', _soltarPuntero);
window.addEventListener('pointermove', e=>{
  if(!_punterosActivos.has(e.pointerId)) return;
  _punterosActivos.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(_punterosActivos.size>=2){
    const pts = Array.from(_punterosActivos.values());
    const dx=pts[0].x-pts[1].x, dy=pts[0].y-pts[1].y;
    const dist = Math.hypot(dx,dy);
    if(_pinchDistanciaPrevia!=null){
      // separar dedos (dist crece) = acercar cámara → mismo signo que
      // deltaY negativo en la rueda de mouse.
      aplicarZoom((_pinchDistanciaPrevia-dist)*2.2);
    }
    _pinchDistanciaPrevia = dist;
    return;
  }

  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  camTheta -= dx*0.006;
  camPhi = Math.max(0.08, Math.min(Math.PI/2-0.02, camPhi - dy*0.006));
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  aplicarZoom(e.deltaY);
}, {passive:false});

function actualizarCamara(target, radio){
  const x = target.x + radio*Math.sin(camPhi)*Math.sin(camTheta);
  const y = target.y + radio*Math.cos(camPhi);
  const z = target.z + radio*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}

// ============================================================================
// 4) REPRODUCCIÓN / SCRUB
// ============================================================================
let currentT = 0, playing = false, speed = 1, lastFrame = performance.now();
const slider = document.getElementById('slider');
const playBtn = document.getElementById('play');
const velSel = document.getElementById('velSel');
const colorSel = document.getElementById('colorSel');

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'❚❚':'▶'; };
velSel.onchange = ()=> speed=parseFloat(velSel.value);
colorSel.onchange = ()=>{
  modoColor=colorSel.value; reconstruirTubo(); actualizarLeyenda();
  if(postesGroup){ scene.remove(postesGroup); postesGroup=construirPostes(); postesGroup.visible=postesChk.checked; scene.add(postesGroup); }
};
slider.oninput = ()=>{ playing=false; playBtn.textContent='▶'; currentT = (slider.value/1000)*DUR; };

function actualizarLeyenda(){
  document.getElementById('legend-titulo').textContent = modoColor==='alt' ? 'COLOR = ALTITUD' : 'COLOR = VELOCIDAD';
  const [min,max]=rangoColor();
  if(modoColor==='alt'){
    document.getElementById('leg-min').textContent = Math.round(min*3.28084)+' ft';
    document.getElementById('leg-max').textContent = Math.round(max*3.28084)+' ft';
  } else {
    document.getElementById('leg-min').textContent = Math.round(min*1.94384)+' kt';
    document.getElementById('leg-max').textContent = Math.round(max*1.94384)+' kt';
  }
}
actualizarLeyenda();

function muestraEn(t){
  // FIX: antes se usaba Math.floor(t) directo como ÍNDICE del array,
  // asumiendo 1 punto por segundo (cierto en el track sintético del
  // prototipo). Los puntos reales vienen espaciados ~2-3s (muestreo GPS), así
  // que índice y segundos transcurridos NO coinciden — con eso, la
  // reproducción llegaba al índice máximo mucho antes de que "t" llegara a
  // DUR, y el avión quedaba congelado en el último punto el resto del
  // recorrido del slider. Ahora se busca el par de puntos reales que
  // contienen a "t" y se interpola entre esos dos por tiempo real, no por
  // posición en el array.
  let i = 0;
  while(i < track.length-2 && track[i+1].t <= t) i++;
  const a=track[i], b=track[i+1]||a;
  const span = b.t-a.t;
  const f = span>0 ? (t-a.t)/span : 0;
  const lerp=(u,v)=>u+(v-u)*f;
  return {
    x:lerp(a.x,b.x), y:lerp(a.y,b.y), z:lerp(a.z,b.z),
    hdgDeg:lerp(a.hdgDeg,b.hdgDeg), bank:lerp(a.bank,b.bank), pitch:lerp(a.pitch,b.pitch),
    gs:lerp(a.gs,b.gs), vs:lerp(a.vs,b.vs), t,
  };
}

function actualizarInfo(m){
  // Pedido de Daniel: hora real (UTC) del instante actual del track, no solo
  // segundos relativos al inicio del vuelo. epocaInicioSeg + m.t reconstruye
  // el timestamp absoluto (ver procesarPuntos). UTC porque es el criterio que
  // ya usa el resto de la app (turnos.html, vuelo.html) para horas de vuelo.
  const fecha = new Date((epocaInicioSeg + m.t)*1000);
  const hh = String(fecha.getUTCHours()).padStart(2,'0');
  const mm = String(fecha.getUTCMinutes()).padStart(2,'0');
  const ss = String(fecha.getUTCSeconds()).padStart(2,'0');
  document.getElementById('v-hora').textContent = `${hh}:${mm}:${ss}Z`;
  document.getElementById('v-alt').textContent = Math.round(m.y*3.28084)+' ft';
  document.getElementById('v-gs').textContent = Math.round(m.gs*1.94384)+' kt';
  document.getElementById('v-hdg').textContent = Math.round((m.hdgDeg%360+360)%360)+'°';
  document.getElementById('v-bank').textContent = Math.round(m.bank*180/Math.PI)+'°';
  document.getElementById('v-pitch').textContent = Math.round(m.pitch*180/Math.PI)+'°';
  document.getElementById('v-vs').textContent = Math.round(m.vs*196.85)+' fpm';
}

// ============================================================================
// 5) LOOP DE RENDER
// ============================================================================
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function loop(now){
  const dt=(now-lastFrame)/1000; lastFrame=now;
  if(playing){
    currentT += dt*speed;
    if(currentT>=DUR){ currentT=DUR; playing=false; playBtn.textContent='▶'; }
    slider.value = Math.round((currentT/DUR)*1000);
  }
  if(_heliceRef && playing){ _heliceRef.rotation.y += dt*22; } // gira mientras reproduce, de yapa
  const m = muestraEn(currentT);
  const pos = new THREE.Vector3(m.x, ry(m.y) + RADIO_TUBO*1.3 + 4, m.z); // offset: se posa
    // ENCIMA del tubo en vez de quedar centrado en su eje (más pegado que antes).
  avion.position.copy(pos);
  // v4 FIX: el tubo se dibuja con la pendiente EXAGERADA (EXAG_VERT), pero acá se
  // usaba m.pitch real (mucho más suave) para orientar el avión — por eso no
  // acompañaba el ángulo dibujado del tubo. atan(EXAG·tan(pitch)) da el ángulo
  // correspondiente a esa misma pendiente exagerada. El panel numérico de la
  // izquierda sigue mostrando m.pitch SIN exagerar (ver actualizarInfo).
  const pitchRender = Math.atan(EXAG_VERT*Math.tan(m.pitch));
  // signo negativo: en Three.js, rotar +X hace que +Z (nuestro morro) baje hacia
  // -Y, no suba — sin este signo el avión piqueaba en las subidas y encabritaba
  // en las bajadas (exactamente al revés de lo que muestra el tubo).
  // signo negativo también en el bank: mismo motivo que el pitch — con
  // rotation.order 'YXZ', rotar +Z (nuestro eje de roll local) mueve el ala
  // derecha hacia ABAJO para un ángulo positivo, no hacia arriba, así que sin
  // este signo bankeaba para el lado opuesto del giro.
  avion.rotation.set(-pitchRender, m.hdgDeg*Math.PI/180, -m.bank, 'YXZ');
  avion.updateMatrixWorld(true); // para que la posición de la cola de abajo sea la de ESTE frame

  if(playing && humoChk.checked){
    // v1.13 FIX reportado por Daniel: a 1x se veía "una nube pegada al avión"
    // en vez de una estela. Causa real: esto emitía un puff cada
    // HUMO_INTERVALO segundos de TIEMPO REAL, sin importar cuánta distancia
    // recorría el avión en ese instante — pero el apagado de cada puff (desde
    // v1.12) SÍ es por distancia recorrida (3 largos de avión). A 1x, con un
    // objetivo tan corto, el avión no alcanza a alejarse lo suficiente entre
    // un puff y el siguiente antes de que ambos ya estén expirando: quedan
    // amontonados en el mismo lugar en vez de espaciados a lo largo del
    // camino. Ahora el disparador también es por DISTANCIA (recorrida por el
    // avión de verdad, ya afectada por la velocidad real y por el selector
    // de velocidad "x" — currentT avanza con dt*speed, así que "pos" ya se
    // mueve más rápido en el mundo cuando x es mayor), así que el espaciado
    // entre puffs queda siempre proporcional al avión sin importar x.
    if(_humoPosAnterior){
      const movimiento = pos.distanceTo(_humoPosAnterior);
      // tope por si el usuario arrastra el slider (salto grande de golpe):
      // no generar una ráfaga de puffs amontonados en ese instante.
      _humoDistAcumulada += Math.min(movimiento, HUMO_LARGO_OBJETIVO*0.5);
    }
    const espaciado = Math.max(HUMO_LARGO_OBJETIVO/12, 0.3); // ~12 puffs a lo
      // largo de toda la estela — suficientes para que se note como rastro y
      // no como un único puff gigante, sin ser tantos que se coma el
      // rendimiento.
    while(_humoDistAcumulada > espaciado){
      _humoDistAcumulada -= espaciado;
      _emitirHumo(avion.localToWorld(HUMO_OFFSET_LOCAL.clone()));
    }
  } else {
    _humoDistAcumulada = 0; // si se pausa/no hay humo activado, no arrastrar
      // distancia acumulada — si no, al reanudar saldría una ráfaga de golpe.
  }
  _humoPosAnterior = pos.clone();
  for(let i=_humoParticulas.length-1;i>=0;i--){
    const p=_humoParticulas[i];
    p.edad += dt;
    const distanciaRecorrida = p.origen.distanceTo(pos); // cuánto se alejó ya
      // el avión del punto donde se emitió este puff
    const t = Math.max(p.edad/HUMO_VIDA_MAX, distanciaRecorrida/HUMO_LARGO_OBJETIVO);
      // se apaga por lo que llegue primero: el largo objetivo (3 aviones,
      // caso normal) o el tope de tiempo de seguridad (solo si el avión
      // estuviera prácticamente detenido).
    if(t>=1){ scene.remove(p.sprite); p.sprite.material.dispose(); _humoParticulas.splice(i,1); continue; }
    p.sprite.material.opacity = 0.5*(1-t);
    // v1.14 FIX reportado por Daniel: crecimiento y deriva iban con dt REAL
    // (multiplyScalar / += cada frame), así que un puff que tarda más tiempo
    // real en apagarse (que es justo lo que pasa a 1x, con velocidad de
    // reproducción baja) terminaba mucho más grande que uno a 5x — por eso
    // solo a alta velocidad se veía "fino" y con trail, y a 1x se inflaban
    // hasta juntarse en una sola nube. Ahora tamaño y altura se fijan en
    // función de "t" (el mismo avance por distancia que ya se usa para
    // apagarlo), no de cuántos segundos reales pasaron — así el resultado es
    // idéntico sin importar a qué velocidad "x" se reproduzca.
    p.sprite.scale.setScalar(p.tamOriginal*(1+t*HUMO_CRECIMIENTO));
    p.sprite.position.y = p.origen.y + AVION_LARGO_MUNDO*HUMO_DERIVA_MAX_MULT*t;
  }

  lineaVert.geometry.setFromPoints([pos, new THREE.Vector3(m.x,0,m.z)]);
  lineaVert.computeLineDistances();

  const siguiendo = seguirChk.checked;
  actualizarCamara(siguiendo ? pos : centro, siguiendo ? camRadioSeguir : camRadioLibre);
  actualizarInfo(m);

  // "Suelo infinito": el plano se recentra bajo la cámara en cada frame para
  // que el borde nunca quede a la vista. Con el degradado liso de antes eso
  // alcanzaba (recentrar no se notaba). Con la textura de pasto/tierra (que
  // SÍ repite un patrón) recentrar la MALLA sin más haría que el dibujo
  // pareciera "pegado" a la cámara en vez de fijo al terreno — se corrige
  // corriendo el offset de la textura exactamente lo contrario de lo que se
  // corrió la malla, para que el patrón quede anclado al mundo. La malla
  // rotó -90° en X: su eje local +Y (V alto) cae en mundo -Z (mismo cálculo
  // que se usó para orientar la rosa de rumbos) — de ahí el signo cambiado
  // en offset.y.
  suelo.position.x = camera.position.x;
  suelo.position.z = camera.position.z;
  texSuelo.offset.x = camera.position.x / tileSizeSuelo;
  texSuelo.offset.y = -camera.position.z / tileSizeSuelo;

  // Cartelito flotante junto al avión: proyecta su posición 3D a coordenadas
  // de pantalla (NDC -> píxeles) y lo reubica ahí cada frame.
  const puntoEtiqueta = pos.clone(); puntoEtiqueta.y += MODELO_ESCALA*6; // FIX: antes
    // un 42 fijo, calibrado cuando MODELO_ESCALA era una constante (7) — desde
    // que escala con extent, un número fijo queda desproporcionado según el
    // largo del vuelo. 42/7=6, esa es la proporción que se mantiene ahora.
  const ndc = puntoEtiqueta.project(camera);
  const etiqueta = document.getElementById('etiqueta-avion');
  if(ndc.z > 1){
    etiqueta.style.display = 'none'; // el avión quedó detrás de la cámara
  } else {
    etiqueta.style.display = 'block';
    // v1.24: el canvas ahora tiene transform:scaleX(-1) (ver CSS) para
    // corregir el espejo este-oeste, pero este cartelito es un elemento HTML
    // aparte, fuera del canvas — no lo alcanza esa transformación. Hay que
    // espejarlo a mano para que siga cayendo sobre el avión.
    etiqueta.style.left = ((1-(ndc.x*0.5+0.5))*stage.clientWidth) + 'px';
    etiqueta.style.top = ((-ndc.y*0.5+0.5)*stage.clientHeight) + 'px';
    etiqueta.textContent = Math.round((m.hdgDeg%360+360)%360)+'° · '+Math.round(m.y*3.28084)+' ft';
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

}

</script>
</body>
