<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Browser de Reservas - Aeroclub Río Grande</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1419; color:#e5e9ec; margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  input, select, button { font-size:14px; padding:6px 10px; border-radius:6px; border:1px solid #2a333c; background:#1a2129; color:#e5e9ec; }
  button { cursor:pointer; }
  button:hover { background:#242e38; }
  .btn-danger { border-color:#8a2e2e; color:#ff8a8a; }
  .btn-danger:hover { background:#3a1a1a; }
  .btn-save { border-color:#2e8a4e; color:#8affa8; }
  .btn-save:hover { background:#1a3a22; }
  #status { font-size:13px; color:#9aa5ad; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #232b32; vertical-align:top; }
  th { position:sticky; top:0; background:#161c22; cursor:pointer; user-select:none; }
  th:hover { color:#fff; }
  tr:hover { background:#161c22; }
  .key { font-family:monospace; font-size:11px; color:#6b7680; }
  .expand-row td { background:#12171c; padding:10px; }
  textarea { width:100%; min-height:220px; font-family:monospace; font-size:12px; background:#0c1014; color:#c9e5c9; border:1px solid #2a333c; border-radius:6px; padding:8px; }
  .actions { display:flex; gap:6px; margin-top:8px; }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; }
  .b-pendiente { background:#3a3a1a; color:#e5e58a; }
  .b-aprobado { background:#1a3a22; color:#8affa8; }
  .b-vencido { background:#3a1a1a; color:#ff8a8a; }
  .b-cancelado { background:#2a2a2a; color:#999; }
  .count { color:#6b7680; font-size:12px; }
</style>
</head>
<body>

<h1>Browser de Reservas — /reservas</h1>
<div class="toolbar">
  <input id="q" placeholder="Buscar (nombre, fecha, aeronave, key...)" style="width:280px">
  <input id="fFecha" type="date" title="Filtrar por fecha exacta">
  <select id="fEstado">
    <option value="">Todos los estados</option>
    <option value="pendiente">pendiente</option>
    <option value="aprobado">aprobado</option>
    <option value="vencido">vencido</option>
    <option value="cancelado">cancelado</option>
  </select>
  <button id="btnReload">↻ Recargar</button>
  <span class="count" id="count"></span>
</div>
<div id="status">Cargando...</div>

<table>
  <thead>
    <tr>
      <th data-sort="fecha">Fecha</th>
      <th data-sort="hora">Hora</th>
      <th data-sort="aeronave">Aeronave</th>
      <th data-sort="nombre">Nombre</th>
      <th data-sort="tipo">Tipo</th>
      <th data-sort="estado">Estado</th>
      <th>Key</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const DB = "https://turnos-lv-oad-default-rtdb.firebaseio.com";
let reservas = {};
let sortKey = "fecha";
let sortDir = 1;
let expandedKey = null;

function nombreDe(r) {
  return r.alumno || r.piloto || r.nombre || r.nombre_alumno || r.nombre_piloto || "";
}

async function cargar() {
  document.getElementById('status').textContent = "Cargando...";
  const res = await fetch(`${DB}/reservas.json`);
  reservas = await res.json() || {};
  document.getElementById('status').textContent = `Cargado. ${Object.keys(reservas).length} registros totales.`;
  render();
}

function matchesFilters(key, r) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fFecha = document.getElementById('fFecha').value;
  const fEstado = document.getElementById('fEstado').value;

  if (fFecha && r.fecha !== fFecha) return false;
  if (fEstado && r.estado !== fEstado) return false;
  if (q) {
    const blob = (key + " " + JSON.stringify(r)).toLowerCase();
    if (!blob.includes(q)) return false;
  }
  return true;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = "";

  let entries = Object.entries(reservas).filter(([k, r]) => matchesFilters(k, r));

  entries.sort((a, b) => {
    const va = (a[1][sortKey] || "").toString();
    const vb = (b[1][sortKey] || "").toString();
    return va.localeCompare(vb) * sortDir;
  });

  document.getElementById('count').textContent = `${entries.length} coincidencias`;

  for (const [key, r] of entries) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.fecha || ""}</td>
      <td>${r.hora || ""}</td>
      <td>${r.aeronave || ""}</td>
      <td>${nombreDe(r)}</td>
      <td>${r.tipo || ""}</td>
      <td><span class="badge b-${r.estado || ""}">${r.estado || ""}</span></td>
      <td class="key">${key}</td>
      <td><button data-key="${key}" class="btn-expand">Ver/Editar</button></td>
    `;
    tbody.appendChild(tr);

    if (expandedKey === key) {
      const exp = document.createElement('tr');
      exp.className = "expand-row";
      exp.innerHTML = `
        <td colspan="8">
          <textarea id="edit-${key}">${JSON.stringify(r, null, 2)}</textarea>
          <div class="actions">
            <button class="btn-save" data-key="${key}">💾 Guardar cambios</button>
            <button class="btn-danger" data-key="${key}">🗑 Borrar registro</button>
            <button data-close="1">Cerrar</button>
          </div>
        </td>
      `;
      tbody.appendChild(exp);
    }
  }

  tbody.querySelectorAll('.btn-expand').forEach(b => b.onclick = () => {
    expandedKey = (expandedKey === b.dataset.key) ? null : b.dataset.key;
    render();
  });
  tbody.querySelectorAll('.btn-save').forEach(b => b.onclick = () => guardar(b.dataset.key));
  tbody.querySelectorAll('.btn-danger').forEach(b => b.onclick = () => borrar(b.dataset.key));
  tbody.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { expandedKey = null; render(); });
}

async function guardar(key) {
  const ta = document.getElementById(`edit-${key}`);
  let parsed;
  try {
    parsed = JSON.parse(ta.value);
  } catch (e) {
    alert("JSON inválido: " + e.message);
    return;
  }
  if (!confirm(`Confirmar guardado de cambios en ${key}?`)) return;
  await fetch(`${DB}/reservas/${key}.json`, {
    method: "PUT",
    body: JSON.stringify(parsed)
  });
  reservas[key] = parsed;
  document.getElementById('status').textContent = `✅ Guardado ${key}`;
  render();
}

async function borrar(key) {
  const r = reservas[key];
  if (!confirm(`BORRAR definitivamente ${key}?\n\n${nombreDe(r)} - ${r.fecha} ${r.hora} - ${r.aeronave}`)) return;
  await fetch(`${DB}/reservas/${key}.json`, { method: "DELETE" });
  delete reservas[key];
  expandedKey = null;
  document.getElementById('status').textContent = `🗑 Borrado ${key}`;
  render();
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    render();
  };
});

document.getElementById('q').oninput = render;
document.getElementById('fFecha').onchange = render;
document.getElementById('fEstado').onchange = render;
document.getElementById('btnReload').onclick = cargar;

cargar();
</script>

</body>
</html>
